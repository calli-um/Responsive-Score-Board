<html>
    <head>
        <title>Score Board</title>
        <link rel="stylesheet" href="SB.css">
    </head>
    <body>
        <header>SCORE BOARD</header>
        <div class="container">
            <div>
                <h3>HOME</h3>
                <h1 class="h1" id="hscore"></h1>
                <button onclick=hadd1()>+1</button>
                <button onclick=hadd2()>+2</button>
                <button onclick=hadd3()>+3</button>
            </div>
            <div>
                <h3>GUEST</h3>
                <h1 class="h1" id="gscore"></h1>
                <button onclick=gadd1()>+1</button>
                <button onclick=gadd2()>+2</button>
                <button onclick=gadd3()>+3</button>
            </div>
        </div>
        <script src="SB.js"></script>
    </body>
</html>
